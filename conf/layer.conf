# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory containing .bb and .bbappend files, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb* \
            ${LAYERDIR}/recipes*/*.bb* \
            ${LAYERDIR}/images/*.bb"

BBFILES_DYNAMIC += " \
    qt5-layer:${LAYERDIR}/dynamic-layers/recipes-browser/kiosk-browser/kiosk-browser_*.bb \
"

BBFILE_COLLECTIONS += "rustypig-layer"
BBFILE_PATTERN_rustypig-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_rustypig-layer = "9"

LAYERSERIES_COMPAT_rustypig-layer = "whinlatter"

LAYERDEPENDS_rustypig-layer = "core openembedded-layer"


